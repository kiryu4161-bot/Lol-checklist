<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoL Champions Checkliste</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0a0a14;
    color: #c8aa6e;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 2em;
    color: #c8aa6e;
    text-shadow: 0 0 20px #c8aa6e66;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .subtitle {
    text-align: center;
    color: #785a28;
    margin-bottom: 18px;
    font-size: 0.85em;
    letter-spacing: 1px;
  }
  .stats {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .stat-box {
    background: #0d1117;
    border: 1px solid #2a1e0e;
    border-radius: 8px;
    padding: 8px 18px;
    text-align: center;
    min-width: 100px;
  }
  .stat-box .num { font-size: 1.6em; font-weight: bold; color: #c8aa6e; }
  .stat-box .label { font-size: 0.7em; color: #785a28; text-transform: uppercase; letter-spacing: 1px; }
  .progress-bar {
    width: 100%;
    max-width: 600px;
    margin: 0 auto 18px;
    background: #1a1208;
    border-radius: 10px;
    height: 10px;
    border: 1px solid #2a1e0e;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #785a28, #c8aa6e);
    border-radius: 10px;
    transition: width 0.3s;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }
  input[type="text"] {
    padding: 7px 13px;
    border-radius: 6px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    color: #c8aa6e;
    font-size: 0.9em;
    width: 220px;
    outline: none;
  }
  input[type="text"]::placeholder { color: #3a2e1a; }
  input[type="text"]:focus { border-color: #785a28; }
  select {
    padding: 7px 13px;
    border-radius: 6px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    color: #c8aa6e;
    font-size: 0.9em;
    outline: none;
    cursor: pointer;
  }
  .sort-btns { display: flex; gap: 4px; }
  .sort-btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    color: #785a28;
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btn.active { border-color: #c8aa6e; color: #c8aa6e; background: #1a1208; }
  .sort-btn:hover { border-color: #785a28; color: #c8aa6e; }
  .action-btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    color: #785a28;
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .action-btn:hover { border-color: #785a28; color: #c8aa6e; background: #1a1208; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 7px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .section-header {
    grid-column: 1 / -1;
    font-size: 0.72em;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 6px 2px 4px;
    border-bottom: 1px solid #1a1208;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .champion {
    background: #0d1117;
    border: 1px solid #1a1208;
    border-radius: 7px;
    padding: 9px 11px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }
  .champion:hover { border-color: #3a2e1a; background: #111520; }
  .champion.checked { background: #0a150a; border-color: #1a401a; }
  .champion.checked .champ-name { color: #4caf50; }
  .role-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .checkbox {
    width: 17px; height: 17px;
    border: 1.5px solid #3a2e1a;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a14;
    margin-left: auto;
    transition: all 0.12s;
  }
  .champion.checked .checkbox { background: #1a401a; border-color: #4caf50; }
  .checkbox::after {
    content: '✓';
    color: #4caf50;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .champion.checked .checkbox::after { opacity: 1; }
  .champ-name {
    font-size: 0.83em;
    color: #c8aa6e;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    color: #3a2e1a;
    padding: 40px;
    font-size: 0.9em;
  }

  .top-tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 0 auto 18px;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    color: #785a28;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .tab-btn:hover { border-color: #785a28; color: #c8aa6e; }
  .tab-btn.active {
    border-color: #c8aa6e;
    color: #c8aa6e;
    background: #1a1208;
    box-shadow: 0 0 14px #c8aa6e22;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .kiryu-banner {
    max-width: 720px;
    margin: 0 auto 14px;
    padding: 12px 16px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    border-radius: 10px;
    text-align: center;
    color: #785a28;
    font-size: 0.82em;
  }
  .kiryu-banner strong { color: #c8aa6e; }


  .admin-box {
    max-width: 720px;
    margin: 0 auto 14px;
    padding: 12px;
    border: 1px solid #2a1e0e;
    background: #0d1117;
    border-radius: 10px;
  }
  .admin-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
  }
  .admin-row input {
    width: min(240px, 100%);
  }
  .admin-status {
    text-align: center;
    margin-top: 8px;
    font-size: 0.75em;
    color: #785a28;
  }
  .admin-only-note {
    text-align: center;
    margin: 8px 0 14px;
    font-size: 0.75em;
    color: #4caf50;
    display: none;
  }
  #kiryu-grid.admin-mode .champion { cursor: pointer !important; }
  #kiryu-grid.admin-mode .champion:hover { border-color: #785a28; }


.site-logo{display:flex;justify-content:center;margin:0 auto 12px}
.site-logo img{width:190px;max-width:55vw;height:auto;border-radius:18px;display:block}
</style>
<link rel="icon" type="image/png" href="logo.PNG">
<link rel="apple-touch-icon" href="logo.PNG">
</head>
<body>

<div class="site-logo"><img src="logo.PNG" alt="Kiryu Dedication Logo"></div>
<h1>⚔ LoL Champions Checkliste</h1>
<p class="subtitle">173 Champions · Stand: 2026</p>

<div class="top-tabs">
  <button class="tab-btn active" id="tab-own-btn" onclick="switchTab('own')">✓ Eigene Checkliste</button>
  <button class="tab-btn" id="tab-kiryu-btn" onclick="switchTab('kiryu')">👑 Kiryu Dedication</button>
</div>

<section class="tab-panel active" id="tab-own">
  <div class="stats">
    <div class="stat-box">
      <div class="num" id="total-count">173</div>
      <div class="label">Gesamt</div>
    </div>
    <div class="stat-box">
      <div class="num" id="checked-count">0</div>
      <div class="label">Abgehakt</div>
    </div>
    <div class="stat-box">
      <div class="num" id="remaining-count">173</div>
      <div class="label">Verbleibend</div>
    </div>
    <div class="stat-box">
      <div class="num" id="percent">0%</div>
      <div class="label">Fortschritt</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Champion suchen..." oninput="render()">
    <select id="role-filter" onchange="render()">
      <option value="">Alle Rollen</option>
      <option value="Fighter">Fighter</option>
      <option value="Mage">Mage</option>
      <option value="Assassin">Assassin</option>
      <option value="Tank">Tank</option>
      <option value="Support">Support</option>
      <option value="Marksman">Marksman</option>
    </select>
    <select id="status-filter" onchange="render()">
      <option value="">Alle</option>
      <option value="checked">✓ Abgehakt</option>
      <option value="unchecked">✗ Offen</option>
    </select>
    <div class="sort-btns">
      <button class="sort-btn active" id="btn-role" onclick="setSort('role')">Nach Rolle</button>
      <button class="sort-btn" id="btn-alpha" onclick="setSort('alpha')">Alphabetisch</button>
    </div>
    <button class="action-btn" onclick="checkAll()">Alle abhaken</button>
    <button class="action-btn" onclick="uncheckAll()">Zurücksetzen</button>
  </div>
  <p style="text-align:center;font-size:0.72em;color:#4caf50;margin-top:-8px;margin-bottom:14px;">
    ✓ Dein Fortschritt wird nur in deinem Browser gespeichert
  </p>

  <div class="grid" id="grid"></div>
</section>

<section class="tab-panel" id="tab-kiryu">
  <div class="kiryu-banner">
    <strong>Kiryu Dedication</strong>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="num" id="kiryu-total">173</div>
      <div class="label">Gesamt</div>
    </div>
    <div class="stat-box">
      <div class="num" id="kiryu-checked">0</div>
      <div class="label">Abgehakt</div>
    </div>
    <div class="stat-box">
      <div class="num" id="kiryu-remaining">173</div>
      <div class="label">Verbleibend</div>
    </div>
    <div class="stat-box">
      <div class="num" id="kiryu-percent">0%</div>
      <div class="label">Fortschritt</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="kiryu-progress-fill" style="width:0%"></div>
  </div>

  <div class="grid" id="kiryu-grid"></div>
</section>

let checked = new Set();
let sortMode = 'role';

try {
  const saved = localStorage.getItem('lol_checked_v2');
  if (saved) checked = new Set(JSON.parse(saved));
} catch(e) {}

function save() {
  try { localStorage.setItem('lol_checked_v2', JSON.stringify([...checked])); } catch(e) {}
}

function updateStats() {
  const n = checked.size;
  const total = champions.length;
  document.getElementById('checked-count').textContent = n;
  document.getElementById('remaining-count').textContent = total - n;
  document.getElementById('percent').textContent = Math.round(n / total * 100) + '%';
  document.getElementById('progress-fill').style.width = (n / total * 100) + '%';
  document.getElementById('total-count').textContent = total;
}

function toggle(name) {
  if (checked.has(name)) checked.delete(name);
  else checked.add(name);
  save();
  updateStats();
  const el = document.querySelector(`.champion[data-name="${CSS.escape(name)}"]`);
  if (el) el.classList.toggle('checked', checked.has(name));
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('btn-role').classList.toggle('active', mode === 'role');
  document.getElementById('btn-alpha').classList.toggle('active', mode === 'alpha');
  render();
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const roleFilter = document.getElementById('role-filter').value;
  const statusFilter = document.getElementById('status-filter').value;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let filtered = champions.filter(c => {
    if (search && !c.name.toLowerCase().includes(search)) return false;
    if (roleFilter && c.role !== roleFilter) return false;
    if (statusFilter === 'checked' && !checked.has(c.name)) return false;
    if (statusFilter === 'unchecked' && checked.has(c.name)) return false;
    return true;
  });

  if (filtered.length === 0) {
    const msg = document.createElement('div');
    msg.className = 'no-results';
    msg.textContent = 'Keine Champions gefunden.';
    grid.appendChild(msg);
    return;
  }

  if (sortMode === 'alpha') {
    // Alphabetisch – mit Buchstaben-Trennern
    filtered.sort((a, b) => a.name.localeCompare(b.name));
    let currentLetter = '';
    filtered.forEach(c => {
      const letter = c.name[0].toUpperCase();
      if (letter !== currentLetter) {
        currentLetter = letter;
        const header = document.createElement('div');
        header.className = 'section-header';
        header.style.color = '#c8aa6e';
        header.innerHTML = `<span class="dot" style="background:#785a28"></span>${letter}`;
        grid.appendChild(header);
      }
      grid.appendChild(makeCard(c));
    });
  } else {
    // Nach Rolle gruppiert
    const roleOrder = ['Fighter','Tank','Marksman','Mage','Assassin','Support'];
    const grouped = {};
    filtered.forEach(c => {
      if (!grouped[c.role]) grouped[c.role] = [];
      grouped[c.role].push(c);
    });
    const order = roleFilter ? [roleFilter] : roleOrder;
    order.forEach(r => {
      if (!grouped[r] || grouped[r].length === 0) return;
      const header = document.createElement('div');
      header.className = 'section-header';
      header.style.color = roleColors[r];
      header.innerHTML = `<span class="dot" style="background:${roleColors[r]}"></span>${r} <span style="color:#3a2e1a;font-size:0.9em">(${grouped[r].length})</span>`;
      grid.appendChild(header);
      grouped[r].sort((a, b) => a.name.localeCompare(b.name)).forEach(c => grid.appendChild(makeCard(c)));
    });
  }
}

function makeCard(c) {
  const div = document.createElement('div');
  div.className = 'champion' + (checked.has(c.name) ? ' checked' : '');
  div.setAttribute('data-name', c.name);
  div.onclick = () => toggle(c.name);
  div.innerHTML = `<span class="role-dot" style="background:${roleColors[c.role]}" title="${c.role}"></span><span class="champ-name">${c.name}</span><div class="checkbox"></div>`;
  return div;
}

function checkAll() {
  const search = document.getElementById('search').value.toLowerCase();
  const roleFilter = document.getElementById('role-filter').value;
  champions.filter(c => {
    if (search && !c.name.toLowerCase().includes(search)) return false;
    if (roleFilter && c.role !== roleFilter) return false;
    return true;
  }).forEach(c => checked.add(c.name));
  save(); updateStats(); render();
}

function uncheckAll() {
  const search = document.getElementById('search').value.toLowerCase();
  const roleFilter = document.getElementById('role-filter').value;
  if (!search && !roleFilter) {
    checked.clear();
  } else {
    champions.filter(c => {
      if (search && !c.name.toLowerCase().includes(search)) return false;
      if (roleFilter && c.role !== roleFilter) return false;
      return true;
    }).forEach(c => checked.delete(c.name));
  }
  save(); updateStats(); render();
}



// ===== KIRYU DEDICATION =====
// Die öffentliche Kiryu-Liste wird aus progress.json geladen.
let kiryuChecked = new Set();

function switchTab(tab) {
  document.getElementById('tab-own').classList.toggle('active', tab === 'own');
  document.getElementById('tab-kiryu').classList.toggle('active', tab === 'kiryu');
  document.getElementById('tab-own-btn').classList.toggle('active', tab === 'own');
  document.getElementById('tab-kiryu-btn').classList.toggle('active', tab === 'kiryu');
  if (tab === 'kiryu') loadKiryuProgress();
}

async function loadKiryuProgress() {
  // Die komplette Champion-Liste immer anzeigen.
  // progress.json bestimmt NUR, welche Champions grün abgehakt sind.
  kiryuChecked = new Set();
  renderKiryu();

  try {
    const response = await fetch('progress.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('progress.json nicht gefunden');

    const data = await response.json();
    const savedChampions = Array.isArray(data.checked_champions)
      ? data.checked_champions
      : [];

    kiryuChecked = new Set(savedChampions);
    renderKiryu();
  } catch (error) {
    console.error(error);
    // Bei einem Fehler bleibt die komplette Liste sichtbar, nur ohne Haken.
  }
}

function renderKiryu() {
  const total = champions.length;
  const n = kiryuChecked.size;
  document.getElementById('kiryu-total').textContent = total;
  document.getElementById('kiryu-checked').textContent = n;
  document.getElementById('kiryu-remaining').textContent = total - n;
  document.getElementById('kiryu-percent').textContent = Math.round(n / total * 100) + '%';
  document.getElementById('kiryu-progress-fill').style.width = (n / total * 100) + '%';

  const grid = document.getElementById('kiryu-grid');
  grid.innerHTML = '';

  const roleOrder = ['Fighter','Tank','Marksman','Mage','Assassin','Support'];
  roleOrder.forEach(r => {
    const group = champions.filter(c => c.role === r);
    if (!group.length) return;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.style.color = roleColors[r];
    const done = group.filter(c => kiryuChecked.has(c.name)).length;
    header.innerHTML = `<span class="dot" style="background:${roleColors[r]}"></span>${r} <span style="color:#3a2e1a;font-size:0.9em">(${done}/${group.length})</span>`;
    grid.appendChild(header);

    group.sort((a,b) => a.name.localeCompare(b.name)).forEach(c => {
      const div = document.createElement('div');
      div.className = 'champion' + (kiryuChecked.has(c.name) ? ' checked' : '');
      div.style.cursor = 'default';
      div.innerHTML = `<span class="role-dot" style="background:${roleColors[c.role]}" title="${c.role}"></span><span class="champ-name">${c.name}</span><div class="checkbox"></div>`;
      grid.appendChild(div);
    });
  });
}

loadKiryuProgress();

render();
updateStats();
</script>
</body>
</html>
